name: Minefade Native Source Review

on:
  push:
    branches: [minefade-deep-renewal, minefade-render-optimization, minefade-worlds-mods-commands]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source review branch
        uses: actions/checkout@v4

      - name: Set up stable Rust toolchain for host and Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Regenerate block catalogue and high-quality mineral atlas
        working-directory: MinefadeNativeEngine
        run: python3 tools/generate_block_catalog.py

      - name: Run native regression tests
        working-directory: MinefadeNativeEngine
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run-world-tests.sh
          python3 tests/test_block_catalog.py

      - name: Build Android debug APK
        working-directory: MinefadeNativeEngine
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s MinefadeNativeEngine/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload review APK
        uses: actions/upload-artifact@v4
        with:
          name: Minefade-0.8.0-Review11-APK
          path: MinefadeNativeEngine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package complete source tree
        shell: bash
        run: |
          set -euo pipefail
          # Include generated catalogue/atlas files produced by the preceding step.
          # git archive omits worktree changes, so package the checked-out tree itself.
          zip -r -q Minefade-0.8.0-source.zip . \
            -x ".git/*" "*/.git/*" \
               "*/build/*" "*/.gradle/*" "*/.cxx/*" \
               "*/.externalNativeBuild/*" "*/intermediates/*" \
               "*/outputs/*" "*/tmp/*" "*/target/*" "*/rust-target/*" \
               "Minefade-0.7.1-source.zip"
          test -s Minefade-0.8.0-source.zip

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: Minefade-0.8.0-source
          path: Minefade-0.8.0-source.zip
          if-no-files-found: error
          retention-days: 14
