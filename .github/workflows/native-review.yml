name: Minefade 2.0 Android Build

on:
  push:
    branches: [minefade-deep-renewal, minefade-render-optimization, minefade-worlds-mods-commands, minefade-render-overhaul-review12, minefade-ultimate-overhaul-phase1, minefade-1.0-complete-overhaul, minefade-2.0, minefade-2.1-stability-shaders, minefade-2.0.3-renderer-rebuild, minefade-2.2-phase6-7-audio]
  workflow_dispatch:

concurrency:
  group: minefade-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source review branch
        uses: actions/checkout@v4

      - name: Apply Minefade 2.0.4 phases 6 and 7
        if: github.ref_name == 'minefade-2.2-phase6-7-audio'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patches/minefade-phase6-7.patch.xz.b64 | xz -dc > /tmp/minefade-phase6-7.patch
          git apply --check /tmp/minefade-phase6-7.patch
          git apply /tmp/minefade-phase6-7.patch

      - name: Generate committed baseline block catalogue
        working-directory: MinefadeNativeEngine
        run: python3 tools/generate_block_catalog.py

      - name: Validate committed Minefade 2.0 sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME:-}" == "minefade-ultimate-overhaul-phase1" || "${GITHUB_REF_NAME:-}" == "minefade-1.0-complete-overhaul" || "${GITHUB_REF_NAME:-}" == "minefade-2.0" || "${GITHUB_REF_NAME:-}" == "minefade-2.1-stability-shaders" || "${GITHUB_REF_NAME:-}" == "minefade-2.0.3-renderer-rebuild" || "${GITHUB_REF_NAME:-}" == "minefade-2.2-phase6-7-audio" ]]; then
            echo "Minefade 2.0 validates the committed source snapshot."
          else
            cat review12-render/part-*.b64 | base64 --decode | xz -dc > /tmp/review12-render.patch
            git apply --check /tmp/review12-render.patch
            git apply /tmp/review12-render.patch
            # WorldSmokeTests now exercises std::any_of in a regression assertion.
            TEST_SOURCE=MinefadeNativeEngine/tests/WorldSmokeTests.cpp
            grep -q '^#include <algorithm>' "$TEST_SOURCE" || sed -i '1i#include <algorithm>' "$TEST_SOURCE"
          fi

      - name: Set up stable Rust toolchain for host and Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Regenerate block catalogue and high-quality mineral atlas
        working-directory: MinefadeNativeEngine
        run: python3 tools/generate_block_catalog.py

      - name: Generate original PCM game audio
        working-directory: MinefadeNativeEngine
        run: python3 tools/generate_audio.py

      - name: Run native regression tests
        working-directory: MinefadeNativeEngine
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run-world-tests.sh
          python3 tests/test_block_catalog.py
          python3 tests/test_audio_assets.py
          python3 tests/test_mfmod_pack.py
          python3 tests/test_shader_pack.py
          python3 tests/test_android_startup_recovery.py
          python3 tests/test_renderer_invariants.py
          python3 tests/test_ambient_audio.py
          python3 tests/test_phase_four_lan_controls.py

      - name: Build Android debug APK
        working-directory: MinefadeNativeEngine
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="MinefadeNativeEngine/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT="${BUILD_TOOLS_DIR}/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          "$AAPT" dump badging "$APK" > /tmp/minefade-apk-badging.txt
          grep -F "package: name='com.minefade.nativeengine'" /tmp/minefade-apk-badging.txt
          grep -F "versionName='2.0.4'" /tmp/minefade-apk-badging.txt

          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libminefade_native.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libminefade_native.so'
          ATLAS_BYTES="$(unzip -p "$APK" assets/textures/block_atlas.rgba | wc -c | tr -d ' ')"
          test "$ATLAS_BYTES" = "1617408"
          sha256sum "$APK"

      - name: Upload Minefade 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Minefade-2.0.4-APK
          path: MinefadeNativeEngine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Minefade 2.0.4 GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minefade-v2.0.4-phase6-7
          name: Minefade 2.0.4 — Fases 6 y 7
          draft: false
          prerelease: true
          files: MinefadeNativeEngine/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Minefade 2.0.4 — actualización candidata para Android.

            Incluye:
            - LOD distante estratificado con hasta seis bandas verticales por columna.
            - Siete pistas musicales originales y doce capas ambientales originales adaptadas a bioma, hora, profundidad y agua.
            - Controles independientes de volumen de música y ambiente.
            - Conservación de los efectos de juego, IDs de bloques y formato de mundos.

            Es una compilación debug/prerelease. Requiere validación visual y auditiva en dispositivos físicos antes de considerarse estable.
      - name: Package complete source tree
        shell: bash
        run: |
          set -euo pipefail
          # Include generated catalogue/atlas files produced by the preceding step.
          # git archive omits worktree changes, so package the checked-out tree itself.
          zip -r -q Minefade-2.0.4-source.zip . \
            -x ".git/*" "*/.git/*" \
               "*/build/*" "*/.gradle/*" "*/.cxx/*" \
               "*/.externalNativeBuild/*" "*/intermediates/*" \
               "*/outputs/*" "*/tmp/*" "*/target/*" "*/rust-target/*" \
               "Minefade-2.0.4-source.zip"
          test -s Minefade-2.0.4-source.zip

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: Minefade-2.0.4-source
          path: Minefade-2.0.4-source.zip
          if-no-files-found: error
          retention-days: 14
